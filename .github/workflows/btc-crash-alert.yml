name: BTC crash alert

on:
  schedule:
    - cron: '7 * * * *'      # every hour at :07 UTC
  workflow_dispatch:         # "Run workflow" button = send a test notification

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check bitcoin
        run: python btc_crash_alert.py
        env:
          TEST: ${{ github.event_name == 'workflow_dispatch' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
